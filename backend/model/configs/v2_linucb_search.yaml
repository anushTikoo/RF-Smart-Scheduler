# Exactly three V2 candidates. All share one band-invariant LinUCB model.
candidates:
  - name: v2_core
    alpha: 0.5
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
    predictor_enabled: false
  - name: v2_predictive
    alpha: 0.5
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
    predictor_enabled: true
  - name: v2_predictive_balanced
    alpha: 1.0
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
    predictor_enabled: true

