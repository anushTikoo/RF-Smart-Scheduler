# Compact, explicit search. Every candidate is trained on all 30 train files.
candidates:
  - name: balanced
    alpha: 1.0
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
  - name: lower_exploration
    alpha: 0.5
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
  - name: higher_exploration
    alpha: 1.5
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
  - name: weaker_regularization
    alpha: 1.0
    regularization: 0.5
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
  - name: stronger_regularization
    alpha: 1.0
    regularization: 2.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.0
    shared_model: true
  - name: stronger_coverage
    alpha: 1.0
    regularization: 1.0
    min_revisit_factor: 0.5
    max_revisit_factor: 3.0
    uncertainty_weight: 0.75
    coverage_bonus_weight: 1.5
    shared_model: true
